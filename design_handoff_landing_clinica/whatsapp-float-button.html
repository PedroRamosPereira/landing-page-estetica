<!-- ============================================================
     Botão flutuante de WhatsApp — snippet portátil
     Cole o <a> antes de </body> e ajuste PHONE / MESSAGE / LABEL.
     Sem dependências. Funciona em qualquer HTML.
     ============================================================ -->

<a id="wa-float"
   href="#"
   target="_blank"
   rel="noopener"
   aria-label="Falar no WhatsApp"
   style="position:fixed;right:clamp(16px,2.5vw,28px);bottom:clamp(16px,2.5vw,28px);z-index:60;
          display:flex;align-items:center;gap:12px;
          background:#25d366;color:#fff;text-decoration:none;
          padding:13px 22px 13px 16px;border-radius:999px;
          box-shadow:0 14px 34px rgba(18,140,70,.32);
          font-family:'Jost',system-ui,sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
          transition:transform .3s ease,background .3s ease,box-shadow .3s ease;">
  <svg viewBox="0 0 32 32" style="flex:0 0 auto;width:26px;height:26px;fill:#fff;" aria-hidden="true">
    <path d="M16.02 3.2c-7.06 0-12.8 5.74-12.8 12.8 0 2.26.6 4.46 1.73 6.4L3.2 28.8l6.56-1.71a12.75 12.75 0 0 0 6.26 1.63h.01c7.06 0 12.8-5.74 12.8-12.8 0-3.42-1.33-6.63-3.75-9.05a12.71 12.71 0 0 0-9.06-3.67Zm0 23.03h-.01c-1.9 0-3.77-.51-5.4-1.48l-.39-.23-4.02 1.05 1.07-3.92-.25-.4a10.61 10.61 0 0 1-1.63-5.67c0-5.87 4.78-10.64 10.65-10.64 2.84 0 5.51 1.11 7.52 3.12a10.57 10.57 0 0 1 3.11 7.53c0 5.87-4.78 10.64-10.65 10.64Zm5.84-7.97c-.32-.16-1.89-.93-2.18-1.04-.29-.11-.5-.16-.71.16-.21.32-.82 1.04-1.01 1.25-.19.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.59-.95-.85-1.59-1.89-1.78-2.21-.19-.32-.02-.5.14-.66.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56-.08-.16-.71-1.72-.98-2.35-.26-.62-.52-.54-.71-.55l-.61-.01c-.21 0-.56.08-.85.4-.29.32-1.11 1.09-1.11 2.65s1.14 3.08 1.3 3.29c.16.21 2.24 3.42 5.43 4.79.76.33 1.35.52 1.81.67.76.24 1.45.21 2 .13.61-.09 1.89-.77 2.15-1.52.27-.75.27-1.38.19-1.52-.08-.13-.29-.21-.61-.37Z"/>
  </svg>
  <span id="wa-float-label">WhatsApp</span>
</a>

<script>
(function () {
  // ---- CONFIGURE AQUI ----
  var PHONE   = "+55 (11) 90000-0000";                       // qualquer formato; só os dígitos são usados
  var MESSAGE = "Olá! Gostaria de agendar uma avaliação.";   // "" para não pré-preencher
  var LABEL   = "WhatsApp";                                  // "" para botão só com ícone
  // ------------------------

  var el = document.getElementById("wa-float");
  var digits = String(PHONE).replace(/\D/g, "");
  el.href = "https://wa.me/" + digits + (MESSAGE ? "?text=" + encodeURIComponent(MESSAGE) : "");

  var label = document.getElementById("wa-float-label");
  if (LABEL) { label.textContent = LABEL; }
  else { label.remove(); el.style.padding = "14px"; el.style.gap = "0"; }

  // hover / active sem CSS externo
  el.addEventListener("mouseenter", function () {
    el.style.background = "#128c46";
    el.style.transform = "translateY(-2px)";
    el.style.boxShadow = "0 18px 40px rgba(18,140,70,.4)";
  });
  el.addEventListener("mouseleave", function () {
    el.style.background = "#25d366";
    el.style.transform = "none";
    el.style.boxShadow = "0 14px 34px rgba(18,140,70,.32)";
  });
})();
</script>
